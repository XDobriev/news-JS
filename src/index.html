<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal | Global News Feed</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="app-layout">
            <header class="header">
                <div class="container header__container">
                    <div class="header__brand">
                        <div class="header__logo-icon" aria-hidden="true">📰</div>
                        <div class="header__brand-text">
                            <h1 class="header__title">News Portal</h1>
                            <p class="header__subtitle">Stay informed with curated global headlines</p>
                        </div>
                    </div>
                    <div class="header__controls">
                        <div class="search-box">
                            <svg
                                class="search-box__icon"
                                viewBox="0 0 24 24"
                                width="18"
                                height="18"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input
                                type="search"
                                id="newsSearch"
                                class="search-box__input"
                                placeholder="Filter articles by keyword..."
                                aria-label="Filter news articles"
                            />
                        </div>
                    </div>
                </div>
            </header>

            <main class="main container">
                <section class="sources-section" aria-labelledby="sources-heading">
                    <div class="section-header">
                        <h2 id="sources-heading" class="section-title">News Sources</h2>
                        <span class="section-badge" id="sourcesCount">Select a channel</span>
                    </div>
                    <div class="sources buttons" role="region" aria-label="Available news sources"></div>
                </section>

                <section class="news-section" aria-labelledby="news-heading">
                    <div class="section-header">
                        <h2 id="news-heading" class="section-title">Latest Stories</h2>
                        <span class="section-badge" id="newsCount">Select a source above</span>
                    </div>
                    <div class="loader" id="loader" aria-live="polite">
                        <div class="loader__spinner"></div>
                        <span class="loader__text">Loading news...</span>
                    </div>
                    <div class="news" aria-live="polite"></div>
                </section>
            </main>

            <footer class="footer">
                <div class="container footer__container">
                    <div class="footer__rs">
                        <a
                            href="https://rs.school/courses/javascript"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="footer__rss-link"
                            aria-label="RS School JavaScript Course"
                        >
                            <img
                                src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg"
                                alt="RS School Logo"
                                class="footer__rss-logo"
                                width="84"
                                height="32"
                                onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='inline-flex';"
                            />
                            <span class="footer__rss-badge" style="display:none;">RS SCHOOL</span>
                        </a>
                    </div>
                    <div class="footer__author">
                        Created by
                        <a
                            href="https://github.com/XDobriev"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="footer__author-link"
                            >XDobriev</a
                        >
                        © <span class="footer__year">2026</span>
                    </div>
                    <div class="footer__source">
                        Powered by
                        <a
                            href="https://newsapi.org"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="footer__api-link"
                            >NewsAPI.org</a
                        >
                    </div>
                </div>
            </footer>
        </div>

        <template id="sourceItemTemp">
            <div class="source__item" role="button" tabindex="0">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo" role="img" aria-label="News preview"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h3 class="news__description-source"></h3>
                    <h2 class="news__description-title"></h2>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#" target="_blank" rel="noopener noreferrer">Read Full Article</a>
                    </p>
                </div>
            </article>
        </template>
    </body>
</html>
